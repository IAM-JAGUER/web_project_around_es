<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />
    <script type="module" src="./index.js"></script>
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <button
            aria-label="Cambiar foto de perfil"
            class="profile__avatar-button"
            type="button"
          >
            <img
              alt="Avatar de Jacques Cousteau"
              class="profile__image"
              src="./images/avatar.jpg"
            />
            <span class="profile__avatar-overlay">
              <img
                alt=""
                class="profile__avatar-edit-icon"
                src="./images/edit-icon.svg"
              />
            </span>
          </button>
          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description">Explorador</p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <template id="card-template">
            <li class="card">
              <img class="card__image" src="" alt="Imagen de la tarjeta" />
              <button
                aria-label="Eliminar tarjeta"
                class="card__delete-button"
                type="button"
              ></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button
                  aria-label="Botón Me gusta"
                  class="card__like-button"
                  type="button"
                ></button>
              </div>
            </li>
          </template>
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>
      <div class="popup" id="edit-popup">
        <div class="popup__content popup__content_type_edit">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_name"
                id="profile-name"
                maxlength="40"
                minlength="2"
                name="name"
                placeholder="Nombre"
                required
                type="text"
              />
              <span class="popup__error" id="profile-name-error"></span>
            </label>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_description"
                id="profile-description"
                maxlength="200"
                minlength="2"
                name="description"
                placeholder="Acerca de mí"
                required
                type="text"
              />
              <span class="popup__error" id="profile-description-error"></span>
            </label>
            <button
              class="button popup__button popup__button_disabled"
              disabled
              type="submit"
            >
              Guardar
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="new-card-popup">
        <div class="popup__content popup__content_type_new-card">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_card-name"
                id="card-name"
                maxlength="30"
                minlength="2"
                name="place-name"
                placeholder="Título"
                required
                type="text"
              />
              <span class="popup__error" id="card-name-error"></span>
            </label>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_url"
                id="card-link"
                name="link"
                placeholder="Enlace a la imagen"
                required
                type="url"
              />
              <span class="popup__error" id="card-link-error"></span>
            </label>
            <button
              class="button popup__button popup__button_disabled"
              disabled
              type="submit"
            >
              Crear
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="avatar-popup">
        <div class="popup__content popup__content_type_avatar">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Cambiar foto de perfil</h3>
          <form class="popup__form" id="avatar-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_avatar"
                id="avatar-link"
                name="avatar"
                placeholder="Enlace a la nueva foto"
                required
                type="url"
              />
              <span class="popup__error" id="avatar-link-error"></span>
            </label>
            <button
              class="button popup__button popup__button_disabled"
              disabled
              type="submit"
            >
              Guardar
            </button>
          </form>
        </div>
      </div>
      <div class="popup" id="confirm-popup">
        <div class="popup__content popup__content_type_confirm">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">¿Estás seguro?</h3>
          <form class="popup__form" id="confirm-form" novalidate>
            <button class="button popup__button" type="submit">Sí</button>
          </form>
        </div>
      </div>
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <img alt="Imagen ampliada" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>
  </body>
</html>
